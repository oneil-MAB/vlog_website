<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hiking Journey</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h2>My Hiking Journey</h2>

    <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to My Hiking Blog!</h1>

        <p>
           <i> <b>E</b>very mountain has a story.
            Join me as I share my hiking experiences,
            adventures, and beautiful memories.
           </i>
        </p>

        <img src="images/hiking4.jpg" alt="My hiking experience">
    </section>

    <section class="container">
        <h2>Share Your Hiking Story</h2>

        <form id="postForm">
            <input type="text" id="postName"
                placeholder="Your Name" required>

            <input type="text" id="postTitle"
                placeholder="Post Title" required>

            <textarea id="postText"
                placeholder="Write your story..."
                required></textarea>

            <button type="submit">Publish Post</button>
        </form>

        <h2>Community Posts</h2>

        <div id="posts"></div>
    </section>

    <script src="script.js"></script>

</body>
</html>
